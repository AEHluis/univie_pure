<div class="tx-univie-pure dataset">

	<h1 class="content-element-margin">
		<f:render partial="Pure/LocalizedText" arguments="{textData: dataSet.title, lang: lang, fallback: 'Untitled'}" />
	</h1>

	<section class="dataset-block dataset-details-block">
		<h3 class="dataset-section-title dataset-section-title--details">
			<f:translate key="LLL:EXT:univie_pure/Resources/Private/Language/locallang.xlf:univiepur.publication.details" />
		</h3>
		<dl>
			<f:if condition="{dataSet.type.term}">
				<dt>
					<f:translate key="LLL:EXT:univie_pure/Resources/Private/Language/locallang.xlf:univiepur.datasets.type"/>
				</dt>
				<dd>
					<f:render partial="Pure/LocalizedText" arguments="{textData: dataSet.type.term, lang: lang, fallback: ''}" />
				</dd>
			</f:if>

			<f:if condition="{dataSet.publicationAvailableDate.year}">
				<dt>
					<f:translate key="LLL:EXT:univie_pure/Resources/Private/Language/locallang.xlf:univiepur.datasets.year"/>
				</dt>
				<dd>
					{dataSet.publicationAvailableDate.year}
				</dd>
			</f:if>

			<f:if condition="{dataSet.persons}">
				<dt>
					<f:translate key="LLL:EXT:univie_pure/Resources/Private/Language/locallang.xlf:univiepur.datasets.creators"/>
				</dt>
				<dd>
					<f:for each="{dataSet.persons}" as="person" iteration="iter">
						<f:if condition="{person.name.firstName} || {person.name.lastName}">
							{person.name.firstName} {person.name.lastName}<f:if condition="{person.role.term}"> (<f:render partial="Pure/LocalizedText" arguments="{textData: person.role.term, lang: lang, fallback: ''}" />)</f:if><f:if condition="{iter.isLast}"><f:else>, </f:else></f:if>
						</f:if>
					</f:for>
				</dd>
			</f:if>

			<f:if condition="{dataSet.license.term}">
				<dt>
					<f:translate key="LLL:EXT:univie_pure/Resources/Private/Language/locallang.xlf:univiepur.datasets.license"/>
				</dt>
				<dd>
					<f:render partial="Pure/LocalizedText" arguments="{textData: dataSet.license.term, lang: lang, fallback: ''}" />
				</dd>
			</f:if>
		</dl>
	</section>

	<f:if condition="{dataSet.descriptions}">
		<f:for each="{dataSet.descriptions}" as="desc">
			<f:if condition="{desc.value}">
				<section class="dataset-block dataset-description-block">
					<h3 class="dataset-section-title">
						<f:render partial="Pure/LocalizedText" arguments="{textData: desc.type.term, lang: lang, fallback: 'Beschreibung'}" />
					</h3>
					<div class="dataset-description-content">
						<f:render partial="Pure/LocalizedHtml" arguments="{textData: desc.value, lang: lang}" />
					</div>
				</section>
			</f:if>
		</f:for>
	</f:if>

	<f:if condition="{dataSet.doi.doi} || {dataSet.links}">
		<section class="dataset-block dataset-links-block">
			<h3 class="dataset-section-title">
				<f:translate key="LLL:EXT:univie_pure/Resources/Private/Language/locallang.xlf:univiepur.projects.links" />
			</h3>
			<f:if condition="{dataSet.doi.doi}">
				<p class="dataset-doi-link">
					<a href="https://doi.org/{dataSet.doi.doi}" target="_blank" rel="noopener noreferrer" class="c-link--extern">https://doi.org/{dataSet.doi.doi}</a>
					(DOI: {dataSet.doi.doi})
				</p>
			</f:if>
			<f:if condition="!{dataSet.doi.doi}">
				<f:for each="{dataSet.links}" as="link">
					<f:if condition="{link.url}">
						<p>
							<a href="{link.url}" target="_blank" rel="noopener noreferrer" class="c-link--extern">{link.url}</a>
						</p>
					</f:if>
				</f:for>
			</f:if>
		</section>
	</f:if>

	<f:if condition="{dataSet.publisher.name}">
		<section class="dataset-block dataset-publisher-block">
			<h3 class="dataset-section-title">
				<f:translate key="LLL:EXT:univie_pure/Resources/Private/Language/locallang.xlf:univiepur.datasets.publisher" />
			</h3>
			<p class="dataset-publisher">
				<f:render partial="Pure/LocalizedText" arguments="{textData: dataSet.publisher.name, lang: lang, fallback: ''}" />
			</p>
		</section>
	</f:if>

	<f:if condition="{relatedOrganizations}">
		<section class="dataset-block dataset-organizations-block">
			<h3 class="dataset-section-title">
				<f:translate key="LLL:EXT:univie_pure/Resources/Private/Language/locallang.xlf:univiepur.publication.units" />
			</h3>
			<ul class="dataset-organizations-list">
				<f:for each="{relatedOrganizations}" as="org">
					<li>
						<f:render partial="Pure/LocalizedText" arguments="{textData: org.name, lang: lang, fallback: ''}" />
					</li>
				</f:for>
			</ul>
		</section>
	</f:if>

	<f:if condition="{relatedProjects}">
		<section class="dataset-block dataset-projects-block">
			<h3 class="dataset-section-title">
				<f:translate key="LLL:EXT:univie_pure/Resources/Private/Language/locallang.xlf:univiepur.datasets.relatedProjects" />
			</h3>
			<ul class="dataset-projects-list">
				<f:for each="{relatedProjects}" as="proj">
					<li>
						<f:render partial="Pure/LocalizedText" arguments="{textData: proj.title, lang: lang, fallback: ''}" />
					</li>
				</f:for>
			</ul>
		</section>
	</f:if>

	<f:if condition="{relatedResearchOutputs}">
		<section class="dataset-block dataset-researchoutputs-block">
			<h3 class="dataset-section-title">
				<f:translate key="LLL:EXT:univie_pure/Resources/Private/Language/locallang.xlf:univiepur.datasets.relatedResearchOutputs" />
			</h3>
			<ul class="dataset-researchoutputs-list">
				<f:for each="{relatedResearchOutputs}" as="ro">
					<li>
						<f:if condition="{ro.rendering}">
							<f:format.raw>{ro.rendering}</f:format.raw>
						</f:if>
						<f:if condition="!{ro.rendering}">
							<f:render partial="Pure/LocalizedText" arguments="{textData: ro.title, lang: lang, fallback: 'Untitled'}" />
						</f:if>
					</li>
				</f:for>
			</ul>
		</section>
	</f:if>

	<f:if condition="{showLinkToPortal}">
		<f:if condition="{dataSet.portalUrl}">
			<footer class="dataset-footer">
				<p class="dataset-portal">
					<f:link.external uri="{dataSet.portalUrl}" target="_blank" rel="noopener noreferrer" class="c-button u-icon-after u-icon-after--new-tab">
						<f:translate key="LLL:EXT:univie_pure/Resources/Private/Language/locallang.xlf:univiepur.publication.portalUrlLong" />
					</f:link.external>
				</p>
			</footer>
		</f:if>
	</f:if>

</div>
