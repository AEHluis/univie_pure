<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true"><f:spaceless>
<f:if condition="{textData}">
<f:then><f:if condition="{lang} == 'de_DE'">
<f:then><f:if condition="{textData.de_DE}"><f:then>{textData.de_DE}</f:then><f:else><f:if condition="{textData.en_GB}"><f:then>{textData.en_GB}</f:then><f:else><f:if condition="{textData.value}"><f:then>{textData.value}</f:then><f:else>{fallback}</f:else></f:if></f:else></f:if></f:else></f:if></f:then>
<f:else><f:if condition="{textData.en_GB}"><f:then>{textData.en_GB}</f:then><f:else><f:if condition="{textData.de_DE}"><f:then>{textData.de_DE}</f:then><f:else><f:if condition="{textData.value}"><f:then>{textData.value}</f:then><f:else>{fallback}</f:else></f:if></f:else></f:if></f:else></f:if></f:else>
</f:if></f:then>
<f:else>{fallback}</f:else>
</f:if>
</f:spaceless></html>
