<f:if condition="{settings.pager.insertAbove}">
    <f:render partial="Pure/Paginate/Pagination" arguments="{pagination:pagination}"/>
</f:if>

<div class="c-search__list">
<f:for each="{projects}" as="item">

    <f:if condition="{item.rendering}">
        <div class="c-search__item">
            <f:format.raw>{item.rendering}</f:format.raw>
            <f:if condition="{settings.singlePid}">
                <div class="more">
                    <f:link.action action="show" arguments="{uuid : item.uuid, what2show:'proj'}"
                               controller="Pure"
                               pageUid="{settings.singlePid}">
                        <strong>
                            <f:translate key="LLL:EXT:univie_pure/Resources/Private/Language/locallang.xlf:univiepur.more"/>
                        </strong>
                    </f:link.action>
                </div>
            </f:if>
            <f:if condition="{item.links}">
                <p class="type">
                    <span class="type_family">URL<span class="type_family_sep">: </span></span>
                    <span class="type_classification">
                        <f:for each="{item.links}" as="link" iteration="Iter">
                            <f:if condition="{link.description.en_GB}">
                                <f:then>
                                    <f:link.external uri="{link.url}" target="_blank" class="c-link--extern"><strong>{link.description.en_GB}</strong></f:link.external>
                                </f:then>
                                <f:else>
                                    <f:if condition="{link.description.de_DE}">
                                        <f:then>
                                            <f:link.external uri="{link.url}" target="_blank" class="c-link--extern"><strong>{link.description.de_DE}</strong></f:link.external>
                                        </f:then>
                                        <f:else>
                                            <f:link.external uri="{link.url}" target="_blank" class="c-link--extern">
                                                <strong>{link.url}</strong>
                                            </f:link.external>
                                        </f:else>
                                    </f:if>
                                </f:else>
                            </f:if>
                            <f:if condition="{Iter.isLast}"><f:else><br/></f:else></f:if>
                        </f:for>
                    </span>
                </p>
            </f:if>
            <f:if condition="{settings.showDescription}">
                <p class="type">
                    <span class="type_family"><f:translate
                            key="LLL:EXT:univie_pure/Resources/Private/Language/locallang.xlf:univiepur.projects.description"/><span
                            class="type_family_sep">: </span></span>
                    <span class="type_classification">
                        <f:comment>Handle multilingual description.</f:comment>
                        <f:if condition="{item.description.en_GB}">
                            <f:then>
                                <f:format.raw>{item.description.en_GB}</f:format.raw>
                            </f:then>
                            <f:else>
                                <f:if condition="{item.description.de_DE}">
                                    <f:then>
                                        <f:format.raw>{item.description.de_DE}</f:format.raw>
                                    </f:then>
                                </f:if>
                            </f:else>
                        </f:if>
                    </span>
                </p>
            </f:if>
            <f:if condition="{settings.linkToPortal}">
                <f:if condition="{item.portalUrl}">
                    <div style="text-align: center; margin-top: 0.3rem">
                        <f:link.external uri="{item.portalUrl}" target="_blank"
                                         class="c-button u-icon-after u-icon-after--new-tab">
                            <f:translate
                                    key="LLL:EXT:univie_pure/Resources/Private/Language/locallang.xlf:univiepur.publication.portalUrlLong"/>
                        </f:link.external>
                    </div>
                </f:if>
            </f:if>
        </div>
    </f:if>
</f:for>
</div>

<f:if condition="{settings.pager.insertBelow}">
    <f:render partial="Pure/Paginate/Pagination" arguments="{pagination:pagination}"/>
</f:if>
