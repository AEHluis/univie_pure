<f:layout name="Default" />
<f:section name="main">
    <f:if condition="{publication.title.value}">
        <f:page.title>{publication.title.value}</f:page.title>
    </f:if>
    <f:flashMessages />
    <f:render partial="Pure/Properties" arguments="{publication:publication, lang:lang, showLinkToPortal:showLinkToPortal}" />

    <f:if condition="{settings.showBibtex}">
        <div class="tx-univie-pure">
            <ul class="accordion" role="list">
                <li class="accordion-item">
                    <button type="button"
                            class="accordion-title"
                            aria-controls="bibtex-accordion"
                            aria-expanded="false"
                            id="bibtex-accordion-label">
                        BibTeX
                    </button>
                    <div class="accordion-content"
                         role="region"
                         aria-labelledby="bibtex-accordion-label"
                         id="bibtex-accordion"
                         hidden>
                        <f:format.raw>{bibtex}</f:format.raw>
                    </div>
                </li>
            </ul>
        </div>

        <script>
            (function() {
                function initAccordion() {
                    var button = document.querySelector('.accordion-title');
                    var content = document.getElementById('bibtex-accordion');

                    if (button && content) {
                        button.addEventListener('click', function() {
                            var isExpanded = button.getAttribute('aria-expanded') === 'true';
                            button.setAttribute('aria-expanded', !isExpanded);
                            content.hidden = isExpanded;
                        });
                    }
                }

                if (document.readyState !== 'loading') {
                    initAccordion();
                } else {
                    document.addEventListener('DOMContentLoaded', initAccordion);
                }
            })();
        </script>
    </f:if>
</f:section>
