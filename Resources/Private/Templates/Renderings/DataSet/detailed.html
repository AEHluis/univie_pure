<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="rendering_dataset rendering_detailed" data-uuid="{data.uuid}">
    <h3 class="dataset-title">
        <f:format.raw>{data.title}</f:format.raw>
    </h3>

    <div class="dataset-details">
        <dl>
            <f:if condition="{data.publicationYear}">
                <dt>Year</dt>
                <dd>{data.publicationYear}</dd>
            </f:if>

            <f:if condition="{data.type}">
                <dt>Type</dt>
                <dd>{data.type}</dd>
            </f:if>

            <f:if condition="{data.doi}">
                <dt>DOI</dt>
                <dd><a href="https://doi.org/{data.doi}" target="_blank" rel="noopener">{data.doi}</a></dd>
            </f:if>

            <f:if condition="{data.info.portalUrl}">
                <dt>Portal</dt>
                <dd><a href="{data.info.portalUrl}" target="_blank" rel="noopener">View in Pure</a></dd>
            </f:if>
        </dl>
    </div>

    <f:if condition="{data.description}">
        <div class="dataset-description">
            <h5>Description</h5>
            <p><f:format.raw>{data.description}</f:format.raw></p>
        </div>
    </f:if>
</div>
</html>
